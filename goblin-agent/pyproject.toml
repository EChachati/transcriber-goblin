[project]
name = "goblin-agent"
version = "0.1.0"
description = "Goblin Agent: resúmenes temáticos de sesiones de rol a partir de la transcripción, con Ollama local"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
goblin-agent = "goblin_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
