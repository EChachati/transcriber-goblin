[workspace]
resolver = "2"
members = [
    "crates/tg-commons",
    "crates/tg-linker",
    "crates/tg-server",
    "crates/tg-transcriber",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
yrs = "0.18"
yrs-axum = "0.8"
rand = "0.8"