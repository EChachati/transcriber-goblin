[project]
name = "tg-transcriber"
version = "0.1.0"
description = "Transcriber Goblin: captura micro+escritorio, transcribe con faster-whisper y publica notas al backend"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "pycrdt>=0.14",
    "nvidia-cublas-cu12>=12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9; sys_platform == 'linux'",
]

[project.scripts]
tg-transcriber = "tg_transcriber.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"
