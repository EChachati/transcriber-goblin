services:
  ysweet:
    image: ghcr.io/jamsocket/y-sweet:latest
    command: ["y-sweet", "serve", "--host", "0.0.0.0", "--port", "7700", "--auth", "${YSWEET_PRIVATE_KEY:?run y-sweet gen-auth first, see README}", "/data"]
    volumes:
      - ysweet-data:/data
    ports:
      - "7700:7700"
    restart: unless-stopped

  api:
    build: ./server
    environment:
      YSWEET_URL: "ys://${YSWEET_SERVER_TOKEN:?missing}@ysweet:7700"
      YSWEET_PUBLIC_URL: "${YSWEET_PUBLIC_URL:-ws://localhost:7700}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}"
      DATA_DIR: /data
    volumes:
      - server-data:/data
    ports:
      - "8000:8000"
    depends_on:
      - ysweet
    restart: unless-stopped

volumes:
  ysweet-data:
  server-data:
